name: Bug report
description: Report a reproducible validation, freeze, replay, review, or audit defect.
title: "bug: "
body:
  - type: textarea
    attributes:
      label: Synthetic reproduction
      description: Provide the smallest public-safe fixture. Do not include a real decision or private evidence.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected and observed behavior
    validations:
      required: true
