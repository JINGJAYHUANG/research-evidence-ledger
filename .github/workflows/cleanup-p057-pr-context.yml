name: Clean P057 PR context marker

on:
  push:
    branches:
      - feat/p057-decision-replay-v1
    paths:
      - .github/workflows/cleanup-p057-pr-context.yml

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/p057-decision-replay-v1
          fetch-depth: 0
          persist-credentials: true
      - name: Remove temporary context and this workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/PR_CONTEXT.tmp
          rm -f .github/workflows/cleanup-p057-pr-context.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove temporary P057 PR context"
          git push origin HEAD:feat/p057-decision-replay-v1
