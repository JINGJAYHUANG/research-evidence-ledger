name: Materialize P057 decision replay system

on:
  push:
    branches:
      - feat/p057-decision-replay-v1
    paths:
      - .p057-bootstrap/**
      - .github/workflows/p057-materialize.yml

permissions:
  contents: write

concurrency:
  group: research-evidence-ledger-p057-materialize
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: src
      EXPECTED_SOURCE_SHA256: 8663be988b904342e3f13fcc4c93f9fdbf14a9f7eb0e27541629c7701b5053e1

    steps:
      - name: Check out staged branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/p057-decision-replay-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: ""

      - name: Reassemble and verify source archive
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .p057-bootstrap -maxdepth 1 -type f -name 'part-*.b64' | wc -l)" -eq 8
          cat .p057-bootstrap/part-*.b64 | base64 --decode > /tmp/research-evidence-ledger-source.tar.xz
          printf '%s  %s\n' \
            "$EXPECTED_SOURCE_SHA256" \
            /tmp/research-evidence-ledger-source.tar.xz \
            | sha256sum --check --strict

      - name: Inspect archive boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import PurePosixPath
          import tarfile

          archive = '/tmp/research-evidence-ledger-source.tar.xz'
          members = []
          with tarfile.open(archive, mode='r:xz') as bundle:
              for member in bundle.getmembers():
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or '..' in path.parts:
                      raise SystemExit(f'unsafe archive path: {member.name}')
                  if member.issym() or member.islnk():
                      raise SystemExit(f'archive links are forbidden: {member.name}')
                  if not member.isfile():
                      raise SystemExit(f'only regular files are permitted: {member.name}')
                  members.append(member.name)
          if len(members) != 143:
              raise SystemExit(f'unexpected source file count: {len(members)}')
          required = {
              './README.md',
              './pyproject.toml',
              './src/research_evidence_ledger/cli.py',
              './tools/release_gate.py',
              './.github/workflows/ci.yml',
              './.github/workflows/release.yml',
          }
          missing = sorted(required - set(members))
          if missing:
              raise SystemExit(f'missing required archive members: {missing}')
          forbidden = [name for name in members if name.startswith('./.p057-bootstrap/')]
          if forbidden or './.github/workflows/p057-materialize.yml' in members:
              raise SystemExit('temporary transport files leaked into the final source archive')
          print(f'archive boundary: PASS | regular_files={len(members)}')
          PY

      - name: Replace staged tree with verified source
        shell: bash
        run: |
          set -euo pipefail
          git rm -rf .
          git clean -fdx
          tar \
            --extract \
            --xz \
            --file /tmp/research-evidence-ledger-source.tar.xz \
            --directory . \
            --no-same-owner \
            --no-same-permissions
          test -f README.md
          test -f tools/release_gate.py
          test ! -e .p057-bootstrap
          test ! -e .github/workflows/p057-materialize.yml

      - name: Run complete release gate
        run: python tools/release_gate.py

      - name: Commit verified non-workflow project files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf .github/workflows
          git checkout HEAD -- .github/workflows
          git add -A
          if git diff --cached --quiet; then
            echo "No materialized source changes to commit."
            exit 0
          fi
          git commit -m "feat: add point-in-time decision replay and learning system"
          git push origin HEAD:feat/p057-decision-replay-v1
