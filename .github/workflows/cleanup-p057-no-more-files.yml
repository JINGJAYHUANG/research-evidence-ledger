name: Remove final P057 construction file

on:
  push:
    branches:
      - feat/p057-decision-replay-v1
    paths:
      - .github/workflows/cleanup-p057-no-more-files.yml

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/p057-decision-replay-v1
          fetch-depth: 0
          persist-credentials: true
      - name: Remove construction file and self-delete
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/NO_MORE_FILES
          rm -f .github/workflows/cleanup-p057-no-more-files.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: finalize P057 branch cleanup"
          git push origin HEAD:feat/p057-decision-replay-v1
