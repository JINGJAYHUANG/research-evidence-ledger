name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: research-evidence-ledger-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      PYTHONPATH: src
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 20
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: ""

      - name: Run complete release gate
        run: python tools/release_gate.py

  generated-replay:
    name: Generated artifact replay
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: src
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: ""

      - name: Regenerate in a clean directory and compare
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/rel-generated
          python tools/generate_examples.py --output /tmp/rel-generated
          diff -ru examples/generated /tmp/rel-generated
          python tools/audit_generated.py

  reproducible-wheel:
    name: Reproducible wheel
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: ""

      - name: Install pinned build tooling
        run: python -m pip install --disable-pip-version-check setuptools==80.9.0 wheel==0.45.1

      - name: Build twice and compare
        shell: bash
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          version="$(python - <<'PY_VERSION'
          import tomllib
          from pathlib import Path
          print(tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'])
          PY_VERSION
          )"
          rm -rf /tmp/wheel-a /tmp/wheel-b build src/*.egg-info
          mkdir -p /tmp/wheel-a /tmp/wheel-b
          python -m pip wheel --disable-pip-version-check --no-deps --no-build-isolation --wheel-dir /tmp/wheel-a .
          rm -rf build src/*.egg-info
          python -m pip wheel --disable-pip-version-check --no-deps --no-build-isolation --wheel-dir /tmp/wheel-b .
          cmp "/tmp/wheel-a/research_evidence_ledger-${version}-py3-none-any.whl" "/tmp/wheel-b/research_evidence_ledger-${version}-py3-none-any.whl"
          python -m venv /tmp/rel-wheel-venv
          /tmp/rel-wheel-venv/bin/pip install --disable-pip-version-check --no-deps "/tmp/wheel-a/research_evidence_ledger-${version}-py3-none-any.whl"
          /tmp/rel-wheel-venv/bin/rel --version
          /tmp/rel-wheel-venv/bin/rel self-test --root .
          sha256sum /tmp/wheel-a/*.whl
