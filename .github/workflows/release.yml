name: Release

on:
  create:
  push:
    branches:
      - "release/v*"

permissions:
  contents: write

concurrency:
  group: research-evidence-ledger-release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      (github.event_name == 'create' && github.event.ref_type == 'branch' && startsWith(github.event.ref, 'release/v')) ||
      (github.event_name == 'push' && startsWith(github.ref_name, 'release/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONPATH: src
    steps:
      - name: Check out immutable candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: ""

      - name: Confirm candidate equals current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - name: Resolve and verify version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "create" ]]; then
            release_ref="${{ github.event.ref }}"
          else
            release_ref="$GITHUB_REF_NAME"
          fi
          version="${release_ref#release/}"
          [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          project="$(python - <<'PY_VERSION'
          import tomllib
          from pathlib import Path
          print(tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'])
          PY_VERSION
          )"
          test "$version" = "v$project"
          test -f "docs/release-notes/$version.md"
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Re-run complete release gate
        run: python tools/release_gate.py

      - name: Install pinned build tooling
        run: python -m pip install --disable-pip-version-check setuptools==80.9.0 wheel==0.45.1

      - name: Configure annotated tag identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create or verify release tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null 2>&1; then
            git fetch origin "refs/tags/$VERSION:refs/tags/$VERSION" --force
            test "$(git rev-list -n 1 "$VERSION")" = "$head_sha"
          else
            git tag -a "$VERSION" -m "Research Evidence Ledger $VERSION" HEAD
            git push origin "refs/tags/$VERSION"
          fi

      - name: Build release assets and provenance
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          rm -rf dist build src/*.egg-info
          mkdir -p dist
          prefix="research-evidence-ledger-${version}/"
          git archive --format=tar --prefix="$prefix" HEAD | gzip -n > "dist/research-evidence-ledger-${version}.tar.gz"
          git archive --format=zip --prefix="$prefix" HEAD > "dist/research-evidence-ledger-${version}.zip"
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)" \
            python -m pip wheel --disable-pip-version-check --no-deps --no-build-isolation --wheel-dir dist .
          VERSION="$VERSION" python - <<'PY_GENERATED'
          import os
          from pathlib import Path
          import zipfile

          version = os.environ['VERSION'].removeprefix('v')
          root = Path('examples/generated')
          target = Path(f'dist/research-evidence-ledger-{version}-generated.zip')
          with zipfile.ZipFile(target, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for path in sorted(root.rglob('*')):
                  if path.is_file():
                      info = zipfile.ZipInfo(path.relative_to(root).as_posix(), date_time=(1980, 1, 1, 0, 0, 0))
                      info.compress_type = zipfile.ZIP_DEFLATED
                      info.external_attr = 0o100644 << 16
                      archive.writestr(info, path.read_bytes())
          PY_GENERATED
          VERSION="$VERSION" python - <<'PY_PROVENANCE'
          import json
          import os
          import unittest
          from pathlib import Path

          def count_tests(suite):
              total = 0
              for item in suite:
                  total += count_tests(item) if isinstance(item, unittest.TestSuite) else 1
              return total

          rubric = json.loads(Path('data/process-rubric.json').read_text(encoding='utf-8'))
          manifest = json.loads(Path('examples/generated/generated-manifest.json').read_text(encoding='utf-8'))
          payload = {
              'schema_version': 1,
              'repository': os.environ['GITHUB_REPOSITORY'],
              'tag': os.environ['VERSION'],
              'commit': os.environ['GITHUB_SHA'],
              'workflow_run_id': os.environ['GITHUB_RUN_ID'],
              'workflow_run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'test_count': count_tests(unittest.defaultTestLoader.discover('tests')),
              'reference_case_count': len(list(Path('examples/cases').glob('*.json'))),
              'adversarial_case_count': len(list(Path('examples/mutants').glob('*.json'))),
              'process_dimension_count': len(rubric['dimensions']),
              'hard_gate_count': len(rubric['hard_gates']),
              'schema_count': len(list(Path('schemas').glob('*.json'))),
              'generated_artifact_count': manifest['file_count'] + 1,
              'python_matrix': ['3.11', '3.12', '3.13'],
              'public_boundary_audit': 'passed',
              'maturity': 'reference-method-and-tooling-validated',
              'production_or_factual_certification': 'not-claimed',
          }
          Path('dist/RELEASE_PROVENANCE.json').write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY_PROVENANCE
          (
            cd dist
            sha256sum \
              "research-evidence-ledger-${version}.tar.gz" \
              "research-evidence-ledger-${version}.zip" \
              "research_evidence_ledger-${version}-py3-none-any.whl" \
              "research-evidence-ledger-${version}-generated.zip" \
              RELEASE_PROVENANCE.json \
              > SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          )

      - name: Create or repair GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          notes="docs/release-notes/$VERSION.md"
          assets=(
            "dist/research-evidence-ledger-${version}.tar.gz"
            "dist/research-evidence-ledger-${version}.zip"
            "dist/research_evidence_ledger-${version}-py3-none-any.whl"
            "dist/research-evidence-ledger-${version}-generated.zip"
            "dist/SHA256SUMS.txt"
            "dist/RELEASE_PROVENANCE.json"
          )
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release edit "$VERSION" --title "Research Evidence Ledger $VERSION" --notes-file "$notes"
            gh release upload "$VERSION" "${assets[@]}" --clobber
          else
            gh release create "$VERSION" "${assets[@]}" \
              --title "Research Evidence Ledger $VERSION" \
              --notes-file "$notes" \
              --verify-tag
          fi
