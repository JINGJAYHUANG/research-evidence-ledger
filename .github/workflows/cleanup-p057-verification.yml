name: Clean P057 verification markers

on:
  push:
    branches:
      - feat/p057-decision-replay-v1
    paths:
      - .github/workflows/cleanup-p057-verification.yml

permissions:
  contents: write

concurrency:
  group: research-evidence-ledger-p057-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/p057-decision-replay-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Remove temporary markers and this workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/p057-verification-trigger.md
          rm -rf .p057-bootstrap
          rm -f .github/workflows/cleanup-p057-verification.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No temporary verification files remain."
            exit 0
          fi
          git commit -m "chore: remove temporary P057 verification files"
          git push origin HEAD:feat/p057-decision-replay-v1
